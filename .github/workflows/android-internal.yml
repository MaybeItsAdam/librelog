name: Android · Play internal

# Builds the signed release bundle and uploads it to Play's internal testing
# track as a draft: nothing reaches testers until you roll it out in Play
# Console (or run with release_status=completed, once the app has been
# published). Run it from the Actions tab. Needs the signing secrets and
# PLAY_STORE_SERVICE_ACCOUNT_JSON, the same Play service account key the
# Takt repo uses (it has access to every app on the account).
#
# Version codes are the UTC date and a two-digit count of this workflow's
# runs that day: 2026102101, 2026102102, … They only ever go up, and stay
# above the codes already uploaded (the last by hand was 2026102002). The
# limit is 99 runs a day; past that, pass version_code yourself. Local
# uploads (fastlane android internal) use the same scheme: see README.md.

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: "versionName, e.g. 0.2.0"
        required: true
      version_code:
        description: "versionCode (blank: today's UTC date and this run's number that day, e.g. 2026102101)"
        required: false
        default: ""
      release_status:
        description: "draft: upload only, roll out in Play Console. completed: straight to internal testers (fails until the app has been published once; Play only takes drafts for a draft app)"
        type: choice
        options: [draft, completed]
        default: draft

concurrency:
  group: android-internal
  cancel-in-progress: false

permissions:
  contents: read
  # Counting today's earlier runs for the version code.
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Pick version
        id: version
        env:
          NAME: ${{ inputs.version_name }}
          CODE: ${{ inputs.version_code }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! printf '%s' "$NAME" | grep -Eq '^[0-9]+(\.[0-9]+){0,2}$'; then
            echo "::error::version_name must look like 1.2.3 (got '$NAME')"; exit 1
          fi
          if [ -z "$CODE" ]; then
            # Runs are queued one at a time (concurrency below) and numbered
            # in creation order, so counting the ones created earlier today
            # gives a suffix that only grows. A re-run keeps its number, and
            # so its code: Play refuses it only if that code was uploaded.
            TODAY="$(date -u +%Y-%m-%d)"
            EARLIER="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/android-internal.yml/runs?created=$TODAY&per_page=100" \
              --jq "[.workflow_runs[] | select(.id < $GITHUB_RUN_ID)] | length")" || {
              echo "::error::Couldn't count today's runs; pass version_code instead"; exit 1
            }
            N=$((EARLIER + 1))
            if [ "$N" -gt 99 ]; then echo "::error::Run $N today: past the two-digit limit, pass version_code"; exit 1; fi
            CODE="$(date -u +%Y%m%d)$(printf '%02d' "$N")"
          fi
          if ! printf '%s' "$CODE" | grep -Eq '^[1-9][0-9]{0,9}$' || [ "$CODE" -gt 2100000000 ]; then
            echo "::error::version_code must be a positive integer up to Play's 2100000000 (got '$CODE')"; exit 1
          fi
          echo "name=$NAME" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "Building $NAME ($CODE)"

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # android/key.properties is git-ignored; write it from secrets. Without
      # it CI release builds come out unsigned, so fail here first.
      - name: Write signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; exit 1; fi
          done
          export KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          # Gradle reads this with java.util.Properties: a backslash is an
          # escape, leading spaces are dropped, and the file is Latin-1. So
          # write each value escaped rather than echoing it raw, or a password
          # with a backslash or an accent signs with the wrong one.
          python3 - > android/key.properties <<'PY'
          import os

          def esc(value):
              out = []
              for c in value:
                  if c == "\\":
                      out.append("\\\\")
                  elif c in "\n\r\t\f":
                      out.append({"\n": "\\n", "\r": "\\r", "\t": "\\t", "\f": "\\f"}[c])
                  elif 0x20 <= ord(c) < 0x7F:
                      out.append(c)
                  else:
                      units = c.encode("utf-16-be")
                      out.extend("\\u%02x%02x" % (units[i], units[i + 1]) for i in range(0, len(units), 2))
              text = "".join(out)
              return "\\" + text if text.startswith(" ") else text

          for key, var in [("storeFile", "KEYSTORE_PATH"), ("storePassword", "KEYSTORE_PASSWORD"),
                           ("keyAlias", "KEY_ALIAS"), ("keyPassword", "KEY_PASSWORD")]:
              print(f"{key}={esc(os.environ[var])}")
          PY

      - name: Build Rust core and Kotlin bindings
        run: scripts/build-android.sh

      - name: Build signed bundle
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.version.outputs.name }}
          VERSION_CODE: ${{ steps.version.outputs.code }}
          # The Web OAuth client id for Sign in with Google; unset hides the
          # button (docs/google-sign-in.md).
          LIBRELOG_GOOGLE_WEB_CLIENT_ID: ${{ secrets.LIBRELOG_GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew bundleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Verify bundle is release-signed
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::$AAB not found"; exit 1; }
          # jarsigner exits 0 for an unsigned jar too, so check what it says.
          if ! jarsigner -verify "$AAB" 2>&1 | grep -q "jar verified"; then
            echo "::error::$AAB is not signed — refusing to upload an unsigned bundle"; exit 1
          fi
          if jarsigner -verify -verbose -certs "$AAB" | grep -q "CN=Android Debug"; then
            echo "::error::$AAB is debug-signed"; exit 1
          fi

      - name: Keep the bundle
        uses: actions/upload-artifact@v4
        with:
          name: librelog-${{ steps.version.outputs.name }}-${{ steps.version.outputs.code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Upload to Play (internal)
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_STORE_SERVICE_ACCOUNT_JSON }}
          RELEASE_STATUS: ${{ inputs.release_status }}
        run: |
          if [ -z "$PLAY_SERVICE_ACCOUNT_JSON" ]; then echo "::error::Secret PLAY_STORE_SERVICE_ACCOUNT_JSON is not set"; exit 1; fi
          KEY="$RUNNER_TEMP/play.json"
          printf '%s' "$PLAY_SERVICE_ACCOUNT_JSON" > "$KEY"
          bundle exec fastlane run upload_to_play_store \
            package_name:uk.co.maybeitssoftware.librelog track:internal release_status:"$RELEASE_STATUS" \
            aab:android/app/build/outputs/bundle/release/app-release.aab \
            json_key:"$KEY" \
            skip_upload_metadata:true skip_upload_images:true skip_upload_screenshots:true skip_upload_changelogs:true

      - name: Remove signing material
        if: always()
        run: rm -f android/key.properties "$RUNNER_TEMP/upload-keystore.jks" "$RUNNER_TEMP/play.json"
