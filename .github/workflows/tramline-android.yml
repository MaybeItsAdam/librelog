name: Tramline · Android

# Triggered by Tramline. Builds the Rust core for Android, then the signed
# release bundle at the version Tramline hands over, and uploads just the .aab
# as an artifact; Tramline pushes it to Play itself. `fastlane android
# internal` still works for manual uploads.

on:
  workflow_dispatch:
    inputs:
      tramline-input:
        description: "JSON from Tramline (version_name, version_code, commit_ref, build_notes)"
        required: false
        default: "{}"

concurrency:
  group: tramline-android-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Configure Tramline
        id: tramline
        uses: tramlinehq/deploy-action@v0.1.7
        with:
          input: ${{ github.event.inputs.tramline-input }}

      - name: Require Tramline version
        env:
          VERSION_NAME: ${{ steps.tramline.outputs.version_name }}
          VERSION_CODE: ${{ steps.tramline.outputs.version_code }}
        run: |
          if [ -z "$VERSION_NAME" ] || [ -z "$VERSION_CODE" ]; then
            echo "::error::No version_name/version_code in tramline-input — this workflow is meant to be triggered by Tramline."; exit 1
          fi
          if ! printf '%s' "$VERSION_CODE" | grep -Eq '^[1-9][0-9]*$'; then
            echo "::error::version_code must be a positive integer (got '$VERSION_CODE')"; exit 1
          fi

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - name: Install cargo-ndk
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      # android/key.properties is git-ignored; write it from secrets. Without
      # it CI release builds come out unsigned, so fail here first.
      - name: Write signing config
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          for v in ANDROID_KEYSTORE_BASE64 KEYSTORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!v}" ]; then echo "::error::Secret $v is not set"; exit 1; fi
          done
          KEYSTORE_PATH="$RUNNER_TEMP/upload-keystore.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          {
            echo "storeFile=$KEYSTORE_PATH"
            echo "storePassword=$KEYSTORE_PASSWORD"
            echo "keyAlias=$KEY_ALIAS"
            echo "keyPassword=$KEY_PASSWORD"
          } > android/key.properties

      - name: Build Rust core and Kotlin bindings
        run: scripts/build-android.sh

      - name: Build signed bundle
        working-directory: android
        env:
          VERSION_NAME: ${{ steps.tramline.outputs.version_name }}
          VERSION_CODE: ${{ steps.tramline.outputs.version_code }}
          # The Web OAuth client id for Sign in with Google; unset hides the
          # button (docs/google-sign-in.md).
          LIBRELOG_GOOGLE_WEB_CLIENT_ID: ${{ secrets.LIBRELOG_GOOGLE_WEB_CLIENT_ID }}
        run: ./gradlew bundleRelease -PversionCode="$VERSION_CODE" -PversionName="$VERSION_NAME"

      - name: Verify bundle is release-signed
        run: |
          AAB=android/app/build/outputs/bundle/release/app-release.aab
          test -f "$AAB" || { echo "::error::$AAB not found"; exit 1; }
          # jarsigner exits 0 for an unsigned jar too, so check what it says.
          if ! jarsigner -verify "$AAB" 2>&1 | grep -q "jar verified"; then
            echo "::error::$AAB is not signed — refusing to hand an unsigned bundle to Tramline"; exit 1
          fi
          if jarsigner -verify -verbose -certs "$AAB" | grep -q "CN=Android Debug"; then
            echo "::error::$AAB is debug-signed"; exit 1
          fi

      - name: Upload bundle
        uses: actions/upload-artifact@v4
        with:
          name: librelog-${{ steps.tramline.outputs.version_name }}-${{ steps.tramline.outputs.version_code }}
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 7
          if-no-files-found: error
