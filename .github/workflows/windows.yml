# Builds the Rust core for Windows, runs the .NET tests against it, and
# builds the WinUI app. The app can only build on Windows, so this is where
# it's first compiled.
name: windows

on:
  push:
    paths: ['core/**', 'windows/**', 'scripts/build-windows.ps1', '.github/workflows/windows.yml']
  pull_request:
    paths: ['core/**', 'windows/**', 'scripts/build-windows.ps1', '.github/workflows/windows.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [x64, ARM64]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc,aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: core

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: windows/global.json

      # WinUI's XAML compiler only reports its errors when it runs inside
      # Visual Studio's MSBuild; under `dotnet build` it can exit 1 silently.
      - uses: microsoft/setup-msbuild@v2

      - name: Core tests (with the C ABI)
        if: matrix.platform == 'x64'
        run: cargo test --release --features capi --manifest-path core/Cargo.toml

      - name: Build core, run .NET tests, build the app
        shell: pwsh
        run: |
          $skip = '${{ matrix.platform }}' -ne 'x64'   # tests run once, on the x64 host
          scripts/build-windows.ps1 -Platforms ${{ matrix.platform }} -SkipTests:$skip

      - name: Publish (NativeAOT, MSIX)
        shell: pwsh
        run: scripts/build-windows.ps1 -Platforms ${{ matrix.platform }} -Publish -SkipTests

      - uses: actions/upload-artifact@v4
        with:
          name: librelog-windows-${{ matrix.platform }}
          # MSBuild writes packages under bin/<platform>/Release/<tfm>/<rid>/AppPackages.
          path: windows/src/Librelog.App/bin/**/AppPackages/**
          if-no-files-found: error
