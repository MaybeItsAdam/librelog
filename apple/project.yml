# XcodeGen spec for the iPhone, iPad and Mac app. Generate the project with
#
#   cd apple && xcodegen
#
# Dailylog.xcodeproj is a build artifact and isn't committed. Run
# scripts/build-apple.sh first so DailylogCore.xcframework exists.
name: Dailylog
options:
  bundleIdPrefix: uk.co.maybeitsadam
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: 6NQNU5YSC2
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Dailylog:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      - path: Sources/DailylogCore
      - path: Fonts
        buildPhase: resources
    dependencies:
      - framework: DailylogCore.xcframework
        embed: false
    entitlements:
      path: App/Dailylog.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Dailylog
        CFBundleURLTypes:
          - CFBundleURLName: uk.co.maybeitsadam.dailylog.auth
            CFBundleURLSchemes: [dailylog]
        UIAppFonts:
          - Arvo-Regular.ttf
          - Arvo-Bold.ttf
          - Arvo-Italic.ttf
          - Arvo-BoldItalic.ttf
          - GeistMono.ttf
        ATSApplicationFontsPath: .
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationCategoryType: public.app-category.lifestyle
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Dailylog uses the camera only to scan another device's pairing code.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.maybeitsadam.dailylog
        PRODUCT_NAME: Dailylog
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-lc++"]
        GENERATE_INFOPLIST_FILE: NO

  DailylogTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies:
      - target: Dailylog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.maybeitsadam.dailylog.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Dailylog:
    build:
      targets:
        Dailylog: all
        DailylogTests: [test]
    test:
      targets: [DailylogTests]
