# XcodeGen spec for the iPhone, iPad and Mac app. Generate the project with
#
#   cd apple && xcodegen
#
# Librelog.xcodeproj is a build artifact and isn't committed. Run
# scripts/build-apple.sh first so LibrelogCore.xcframework exists.
name: Librelog
options:
  bundleIdPrefix: uk.co.maybeitssoftware
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    DEVELOPMENT_TEAM: 6NQNU5YSC2
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Librelog:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
      - path: Sources/LibrelogCore
      - path: Fonts
        buildPhase: resources
    dependencies:
      - framework: LibrelogCore.xcframework
        embed: false
    entitlements:
      path: App/Librelog.entitlements
      properties:
        com.apple.developer.applesignin: [Default]
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Librelog
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleURLTypes:
          - CFBundleURLName: uk.co.maybeitssoftware.librelog.auth
            CFBundleURLSchemes: [librelog]
        UIAppFonts:
          - Arvo-Regular.ttf
          - Arvo-Bold.ttf
          - Arvo-Italic.ttf
          - Arvo-BoldItalic.ttf
          - GeistMono.ttf
        ATSApplicationFontsPath: .
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: true
        UISupportedInterfaceOrientations~iphone: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        LSApplicationCategoryType: public.app-category.lifestyle
        # Sync encrypts entries end to end (XChaCha20-Poly1305): standard
        # algorithms, declared once in App Store Connect.
        ITSAppUsesNonExemptEncryption: true
        NSCameraUsageDescription: Librelog uses the camera only to scan another device's pairing code.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.maybeitssoftware.librelog
        PRODUCT_NAME: Librelog
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        OTHER_LDFLAGS: ["-lc++"]
        GENERATE_INFOPLIST_FILE: NO

  LibrelogTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    sources: [Tests]
    dependencies:
      - target: Librelog
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: uk.co.maybeitssoftware.librelog.tests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)

schemes:
  Librelog:
    build:
      targets:
        Librelog: all
        LibrelogTests: [test]
    test:
      targets: [LibrelogTests]
