[package]
name = "dailylog-core"
version = "0.1.0"
edition = "2024"
publish = false

[lib]
crate-type = ["lib", "staticlib", "cdylib"]
name = "dailylog_core"

[[bin]]
name = "uniffi-bindgen"
path = "uniffi-bindgen.rs"
required-features = ["bindgen"]

[features]
bindgen = ["uniffi/cli"]
# A plain C ABI (JSON in, JSON out) for the Windows app, whose UniFFI C#
# generator lags uniffi-rs. See src/capi.rs.
capi = []

[dependencies]
uniffi = "0.32"
rusqlite = { version = "0.40", features = ["bundled"] }
uuid = { version = "1.27", features = ["v4", "v7"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
time = { version = "0.3", features = ["macros", "formatting", "parsing"] }
blake3 = "1"
bip39 = "3"
base64 = "0.23"
getrandom = "0.3"
zeroize = "1"
chacha20poly1305 = "0.11"
x25519-dalek = { version = "3", features = ["static_secrets"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "debuginfo"
